<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Espace organisateur — Jouer Pour de Bon</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #162033; }
    body { margin: 0; background: #fff; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    .card { border: 1px solid #d8deea; border-radius: 14px; padding: 20px; box-shadow: 0 4px 18px rgba(23, 35, 58, .06); }
    .status { margin: 0 0 16px; padding: 12px 14px; border-radius: 10px; background: #f5f7fb; }
    .error { background: #fff2f1; }
    .ok { background: #eef9f0; }
    [hidden] { display: none !important; }
    button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #bcc6d8; background: white; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Espace organisateur</h1>
      <p id="authStatus" class="status">Vérification de votre accès organisateur…</p>

      <div id="organizerContent" hidden>
        <p>Accès organisateur confirmé.</p>
        <div id="organizerAppMount">
          <!-- Le formulaire / l'application organisateur existante peut être montée ici. -->
        </div>
      </div>

      <div id="debug" hidden></div>
    </section>
  </main>

  <script>
    (() => {
      const statusEl = document.getElementById('authStatus');
      const contentEl = document.getElementById('organizerContent');
      const debugEl = document.getElementById('debug');

      function normalizeRoles(roles) {
        if (!Array.isArray(roles)) return [];
        return roles
          .map((role) => typeof role === 'string' ? role : role && role.name)
          .filter(Boolean)
          .map((name) => String(name).trim().toLowerCase());
      }

      function renderAuth(payload) {
        const loggedIn = Boolean(payload && payload.loggedIn);
        const roles = normalizeRoles(payload && payload.roles);
        const isOrganisateur = Boolean(payload && payload.isOrganisateur) || roles.includes('organisateur') || roles.includes('admin');

        debugEl.textContent = JSON.stringify({ loggedIn, roles, isOrganisateur });

        if (!loggedIn) {
          contentEl.hidden = true;
          statusEl.className = 'status error';
          statusEl.textContent = 'Connexion Wix requise. Veuillez vous connecter au site puis recharger cette page.';
          return;
        }

        if (!isOrganisateur) {
          contentEl.hidden = true;
          statusEl.className = 'status error';
          statusEl.textContent = `Accès organisateur requis. Rôles Wix détectés : ${roles.length ? roles.join(', ') : 'aucun rôle détecté'}`;
          return;
        }

        statusEl.className = 'status ok';
        statusEl.textContent = 'Accès organisateur confirmé.';
        contentEl.hidden = false;
      }

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.type !== 'JPDB_WIX_MEMBER_AUTH') return;
        renderAuth(data);
      });

      // Tell the Wix host that the iframe is ready to receive member auth state.
      window.parent.postMessage({ type: 'JPDB_ORGANIZER_EMBED_READY' }, '*');

      // Fail clearly instead of pretending Wix returned an empty role list.
      window.setTimeout(() => {
        if (statusEl.textContent.includes('Vérification')) {
          statusEl.className = 'status error';
          statusEl.textContent = 'Impossible de vérifier les rôles Wix : aucune information d’authentification reçue du site hôte.';
        }
      }, 5000);
    })();
  </script>
</body>
</html>
